plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sys.update2'
    compileSdk 34

    defaultConfig {
        applicationId "com.sys.update2"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            def envStore = System.getenv("KEYSTORE_FILE")
            def envStorePass = System.getenv("KEYSTORE_PASSWORD")
            def envAlias = System.getenv("KEY_ALIAS")
            def envKeyPass = System.getenv("KEY_PASSWORD")

            if (envStore && envStorePass && envAlias && envKeyPass) {
                storeFile file(envStore)
                storePassword envStorePass
                keyAlias envAlias
                keyPassword envKeyPass
            } else {
                def propsFile = rootProject.file("local.properties")
                if (propsFile.exists()) {
                    def props = new Properties()
                    props.load(new FileInputStream(propsFile))
                    storeFile file(props['KEYSTORE_FILE'] ?: "../creftex-key.jks")
                    storePassword props['KEYSTORE_PASSWORD'] ?: "CREFTEX2024KEY"
                    keyAlias props['KEY_ALIAS'] ?: "creftex"
                    keyPassword props['KEY_PASSWORD'] ?: "CREFTEX2024KEY"
                } else {
                    storeFile file("../creftex-key.jks")
                    storePassword "CREFTEX2024KEY"
                    keyAlias "creftex"
                    keyPassword "CREFTEX2024KEY"
                }
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    // ⭐ Compose مفعّل
    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt'
            ]
        }
    }
}

dependencies {
    // ✅ Compose BOM
    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom
    androidTestImplementation composeBom

    // ✅ Compose UI
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // ✅ Activity Compose
    implementation 'androidx.activity:activity-compose:1.8.2'

    // ✅ Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'

    // Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Material (للـ Theme)
    implementation 'com.google.android.material:material:1.11.0'

    // Constraint
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Networking
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Location
    implementation 'com.google.android.gms:play-services-location:21.0.1'

    // MultiDex
    implementation 'androidx.multidex:multidex:2.0.1'

    // Desugar
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
