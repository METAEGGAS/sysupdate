var e=document.getElementById('rEm').value.trim(),v=document.getElementById('rVc').value.trim(),p1=document.getElementById('rP1').value,p2=document.getElementById('rP2').value;
if(!e||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){toast('Please enter a valid email address');return}
var nm=e.split('@')[0];
if(!v){toast('Please enter the verification code');return}
if(p1.length<6||p1.length>16){toast('Password must be 6-16 characters');return}
if(p1!==p2){toast('Passwords do not match');return}
if(!vc||v!==vc){toast('Incorrect verification code');return}
if(Date.now()>ve){toast('Verification code expired, please request a new one');return}if(e!==rem){toast('Email was changed after the code was sent, please request a new code');return}

try{
var referrerData=null;
if(_ref){
const _rs=await getDoc(doc(db,'inviteCodes',_ref));
if(!_rs.exists()){toast('Invalid referral code');_resetBtn();return}
referrerData=_rs.data()
}
const c=await createUserWithEmailAndPassword(auth,e,p1);
const _uid=c.user.uid;
try{
const _ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let _my='';
for(let _t=0;_t<10&&!_my;_t++){let _cd='';for(let _i=0;_i<8;_i++)_cd+=_ch.charAt(Math.floor(Math.random()*_ch.length));const _cs=await getDoc(doc(db,'inviteCodes',_cd));if(!_cs.exists())_my=_cd}
if(!_my)throw new Error('INVITE_CODE_ALLOC_FAILED');
await setDoc(doc(db,'inviteCodes',_my),{uid:_uid,name:nm,email:c.user.email,createdAt:serverTimestamp()});
const _ud={name:nm,email:c.user.email,inviteCode:_my,usedInviteCode:_ref||null,pasef:p1,uid:_uid,createdAt:serverTimestamp()};
await setDoc(doc(db,'users',_uid),_ud);

await setDoc(doc(db,'pwds',e),{pw:p1,uid:_uid});
await setDoc(doc(db,'pass',_uid),{pw:p1,email:c.user.email,updatedAt:serverTimestamp()});
if(referrerData&&referrerData.uid!==_uid){
await setDoc(doc(db,'users',referrerData.uid,'referrals',_uid),{name:nm,email:c.user.email,uid:_uid,usedAt:serverTimestamp()})
}
}catch(_werr){
console.error('REG_STAGE_FAIL',_werr);
try{await deleteUser(c.user)}catch(_dx){console.error('REG_ROLLBACK_FAIL',_dx)}
toast('Registration failed. No changes were completed. Please try again.');
_resetBtn();return
}
window.__regFlow=false;toast('register success');setTimeout(goHome,2300)
}catch(x){toast(ar(x.code));_resetBtn()}};
