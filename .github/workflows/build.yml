name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute on sdkmanager
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -n1)
          echo "SDKMANAGER=$SDKMANAGER" >> $GITHUB_ENV
          chmod +x "$SDKMANAGER" || true

      - name: Accept Android SDK licenses
        run: yes | $SDKMANAGER --licenses || true

      - name: Install required SDK components
        run: |
          $SDKMANAGER "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: List outputs
        if: always()
        run: |
          echo "=== APK outputs ==="
          find app/build/outputs -type f -name "*.apk" 2>/dev/null || echo "no apk found"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SystemUpdate-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
